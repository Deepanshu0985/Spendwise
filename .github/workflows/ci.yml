name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # RLS and pooled-connection behavior can't be tested against H2 (ADR-018) -
      # *Test.java (surefire, H2) run first, then *IT.java (failsafe) against
      # this real Postgres. Ephemeral per run, so a throwaway password here is
      # fine (see scripts/init-db-roles.sql, which this same password bootstraps).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Runtime role (NOBYPASSRLS) vs. migration role (BYPASSRLS) - see ADR-010
      # and DECISIONS.md ("Found: the runtime app connection had BYPASSRLS all
      # along"). Without this split, every RLS-dependent test below would pass
      # for the wrong reason - the same mistake this split exists to catch.
      DATABASE_URL: jdbc:postgresql://localhost:5432/finance_ci
      DATABASE_USER: app_runtime
      DATABASE_PASSWORD: ci-runtime-password
      FLYWAY_DATABASE_USER: postgres
      FLYWAY_DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap restricted runtime role
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/finance_ci" \
            -v password="$DATABASE_PASSWORD" \
            -f ../scripts/init-db-roles.sql
        working-directory: backend

      - name: Build, unit test (H2) and integration test (Postgres)
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build and typecheck
        working-directory: frontend
        run: npm run build
