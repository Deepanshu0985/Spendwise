name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Phase 0: backend tests run against H2 only (see ADR-018).
      # Once Phase 1 adds Row-Level Security, add a `postgres:` service here
      # and a test profile pointed at it - the RLS isolation tests and the
      # pooled-connection leakage test only mean anything against real PostgreSQL.
      - name: Build and test
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build and typecheck
        working-directory: frontend
        run: npm run build
