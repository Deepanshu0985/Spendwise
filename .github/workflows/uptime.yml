name: Uptime check

# Every five minutes, asks the live backend if it is up. If it is down (after three tries over about a minute, so a free-tier cold
# start is not mistaken for an outage) the run fails, GitHub emails the repository owner, and if the ALERT_WEBHOOK_URL secret is
# set the alert is also posted there. A side effect is that the free Render service is never idle long enough to fall asleep.
#
# It checks the liveness URL only. Never point a monitor at /health/ready: that queries the database and would keep a
# scale-to-zero Neon database awake around the clock, using up its free compute hours.
#
# GitHub only runs scheduled workflows from the default branch, so this starts working once it is merged into main.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HEALTH_URL: https://spendwise-backend-6e3g.onrender.com/api/v1/health
    steps:
      - name: Is the backend up?
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 75 "$HEALTH_URL" || true)
            echo "attempt $attempt: HTTP ${code:-none}"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "The backend did not answer with 200." >&2
          exit 1

      - name: Tell the operator it is down
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -H "Title: Spendwise is not answering" -H "Priority: urgent" \
              -d "The live backend failed three health checks in a row. Open the Render dashboard." "$ALERT_WEBHOOK_URL" || true
          fi
