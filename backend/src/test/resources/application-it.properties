# Integration tests (*IT.java, run via `mvn verify`) against real PostgreSQL -
# RLS and pooled-connection behavior can't be tested against H2 (see
# application-test.properties). CI provides this via a postgres: service
# container; locally, export DATABASE_URL/DATABASE_USER/DATABASE_PASSWORD (and
# FLYWAY_DATABASE_USER/PASSWORD) yourself first, e.g. pointed at a scratch
# Postgres or the Neon dev branch - see backend/README.md.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forces real connection reuse across sequential requests, so the
# pooled-connection leakage test is actually exercising what it claims to.
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=validate
