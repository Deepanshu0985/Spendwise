# In-memory H2 for tests: fast, isolated, never touches the dev file database.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway migrations are intentionally Postgres-native (gen_random_uuid(),
# TIMESTAMPTZ, ...) and do not run on H2 at all - not just "untested," they fail
# to parse. So the test profile skips Flyway and lets Hibernate generate H2
# schema straight from the entity mappings instead. This tests JPA mapping
# correctness and business logic; it does not touch the real migration files.
# Anything Postgres-specific (RLS, migration syntax itself) must be tested
# against real PostgreSQL - see DECISIONS.md.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
