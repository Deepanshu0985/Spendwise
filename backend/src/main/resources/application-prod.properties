# Production: PostgreSQL on the ADR-017 droplet, via Docker Compose (see 08-devops/deployment.md).
# Values come from the environment; see 08-devops/environments.md for the full variable list.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Swagger UI/OpenAPI JSON are a local dev/testing convenience (see OpenApiConfig) - not meant to be publicly reachable once deployed.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Phase 6: LocalFilesystemStorageService is the only StorageService implementation so far
# (see DECISIONS.md) - an S3-compatible (DigitalOcean Spaces, ADR-017) implementation
# replaces this once DO is actually provisioned. Known interim limitation: this path is
# not durable across redeploys on a host with an ephemeral filesystem (e.g. Render).
storage.local-directory=${STORAGE_LOCAL_DIRECTORY:/tmp/spendwise-storage}
