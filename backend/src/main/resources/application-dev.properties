# Local development database: file-based H2, no Docker/PostgreSQL required.
# Data persists under backend/data/ between runs; delete that folder to reset.
spring.datasource.url=jdbc:h2:file:./data/financedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI provider is undecided (D-03); keep AI off in dev until a client is wired up.
ai.enabled=false
