# Load the repo-root .env directly (Spring Boot's own extension-hint syntax
# forces it to be parsed as .properties despite the .env name). This makes
# DATABASE_URL etc. resolve no matter how the app is launched - mvn spring-boot
# :run with a manually-sourced shell, IntelliJ's Run button, java -jar, all of
# it - rather than depending on the launcher having sourced the file into the
# process environment beforehand, which IntelliJ's Run button never does.
# Both paths are tried since IntelliJ and mvn can default to different working
# directories (module root vs project root); whichever one matches loads,
# the other is silently skipped.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Local development database: Neon Postgres (see DECISIONS.md - "Neon Postgres
# replaces H2 for local development"). No Docker, no local install - real
# PostgreSQL, which Phase 1's Row-Level Security actually needs.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI provider is undecided (D-03); keep AI off in dev until a client is wired up.
ai.enabled=false
