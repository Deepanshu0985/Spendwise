# Load the repo-root .env directly (Spring Boot's own extension-hint syntax
# forces it to be parsed as .properties despite the .env name). This makes
# DATABASE_URL etc. resolve no matter how the app is launched - mvn spring-boot
# :run with a manually-sourced shell, IntelliJ's Run button, java -jar, all of
# it - rather than depending on the launcher having sourced the file into the
# process environment beforehand, which IntelliJ's Run button never does.
# Both paths are tried since IntelliJ and mvn can default to different working
# directories (module root vs project root); whichever one matches loads,
# the other is silently skipped.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Local development database: Neon Postgres (see DECISIONS.md - "Neon Postgres
# replaces H2 for local development"). No Docker, no local install - real
# PostgreSQL, which Phase 1's Row-Level Security actually needs.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI provider is undecided (D-03); keep AI off in dev until a client is wired up.

# The Vite dev server (and any browser hitting it directly) serves plain http://localhost,
# not https. A Secure cookie is silently dropped by Safari/Firefox over plain http even on
# localhost (Chromium is the outlier in special-casing localhost as a secure context), which
# breaks both the session cookie and the CSRF double-submit cookie. See DECISIONS.md.
security.cookie-secure=false

# Phase 6: filesystem storage in place of object storage for dev (environments.md) -
# git-ignored, not committed. DigitalOcean Spaces (ADR-017) is wired in once actually provisioned.
storage.local-directory=./.local-storage
