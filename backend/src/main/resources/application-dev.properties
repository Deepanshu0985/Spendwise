# Local development database: Neon Postgres (see DECISIONS.md - "Neon Postgres
# replaces H2 for local development"). No Docker, no local install - real
# PostgreSQL, which Phase 1's Row-Level Security actually needs.
# DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD come from the environment;
# see backend/README.md for how to load them from the repo-root .env locally.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI provider is undecided (D-03); keep AI off in dev until a client is wired up.
ai.enabled=false
