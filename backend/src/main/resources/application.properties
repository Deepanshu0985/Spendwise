spring.application.name=finance-backend
# Render (and most PaaS hosts) assign the port at runtime via $PORT; falls back
# to 8080 for local dev and any host (DigitalOcean/Railway) that doesn't set it.
server.port=${PORT:8080}

# dev by default locally; production sets SPRING_PROFILES_ACTIVE=prod (see 08-devops/environments.md)
spring.profiles.active=dev

spring.jpa.open-in-view=false

# Flyway owns the schema in every environment. Hibernate only validates against it (see application-*.properties).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Migrations run under a privileged (BYPASSRLS) role, per ADR-010 - required
# from Phase 2 on, since the runtime role (spring.datasource.*) must NOT have
# BYPASSRLS or RLS is silently ineffective for real traffic. Falls back to the
# runtime credentials where no separate migration role is configured yet.
spring.flyway.user=${FLYWAY_DATABASE_USER:${DATABASE_USER:}}
spring.flyway.password=${FLYWAY_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}

# ADR-009 cookie session lifecycle. SESSION_TTL is absolute (never extended);
# SESSION_IDLE_TIMEOUT is refreshed on use via last_seen_at.
session.ttl=${SESSION_TTL:30d}
session.idle-timeout=${SESSION_IDLE_TIMEOUT:24h}
session.cookie-name=finance_session

# Session + CSRF cookies carry Secure by default (ADR-009). Only application-dev.properties
# turns this off, since the Vite dev server serves plain http://localhost - Chromium
# special-cases localhost as a secure context for Secure cookies, but Safari and Firefox
# do not, and silently drop the cookie instead of sending it, breaking CSRF/session login.
security.cookie-secure=true

# SameSite=Lax by default (ADR-009) - correct whenever the frontend and backend share one
# origin (the Vite dev proxy locally, or a single edge reverse proxy in production, per
# deployment.md). A split-origin deployment (frontend and backend on different domains,
# e.g. Vercel + Render) must override this to "None" via SECURITY_COOKIE_SAMESITE, since a
# browser never sends a Lax cookie on a cross-site fetch. SameSite=None requires Secure,
# already true above; the CSRF double-submit token (CsrfTokenFilter) is what actually
# defends against CSRF either way - SameSite is defense-in-depth, not the primary control.
security.cookie-samesite=Lax

# CORS is off by default (empty origin = no CORS headers added at all, matching every
# same-origin deployment so far). A split-origin deployment sets this to the frontend's
# exact origin (e.g. https://spendwise.vercel.app) so the browser allows the frontend's
# credentialed fetch calls through.
app.cors.allowed-origin=

# Single-use, short expiry per database-design.md.
password-reset.ttl=1h

# api-specification.md: size capped at 200, requests above it clamped and the
# applied value reported in meta (PageMeta reads page.getSize() post-clamp).
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200

# Phase 6: statement upload. Spring's own multipart ceiling is set slightly above
# statement.upload.max-file-size-bytes (PdfValidator) so that check - not a generic
# Spring multipart rejection - is what actually produces the FILE_TOO_LARGE error.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
statement.upload.max-file-size-bytes=10485760
statement.upload.max-pages=100

# AI categorisation (Phase 11, D-03: Mistral). Off unless AI_ENABLED=true AND MISTRAL_API_KEY is set. The key is a
# secret: it lives only in the git-ignored .env locally and in the host's environment settings, never in this file.
# Caps count rows sent to the model (not money) so they hold whatever the model costs; D-09 defaults, adjustable by env var.
ai.enabled=${AI_ENABLED:false}
ai.mistral.model=${MISTRAL_MODEL:mistral-small-latest}
ai.limits.daily-rows-per-user=${AI_DAILY_ROWS_PER_USER:100}
ai.limits.monthly-rows=${AI_MONTHLY_ROWS:20000}
ai.categorization.confidence-threshold=0.75
ai.categorization.batch-size=20
ai.categorization.max-rows-per-request=60
